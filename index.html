<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fuga Isometrica</title>

  <!-- Unica dipendenza esterna: Three.js (r169), vendorizzata in locale e
       risolta via importmap. Nessun build step, nessun bundler, nessuna rete:
       si apre da server locale e funziona anche offline. -->
  <script type="importmap">
  {
    "imports": {
      "three": "./assets/vendor/three.module.js"
    }
  }
  </script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0a0a12; color: #e0e0f0;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      overflow: hidden;
      /* Mobile: niente scroll/bounce né gesti di zoom accidentali. */
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* Contenitore della scena Three.js: occupa tutto lo schermo. */
    #game { position: fixed; inset: 0; touch-action: none; }
    #game canvas { display: block; }

    /* HUD overlay minimale (l'HUD completo è materia di Fase 4). */
    #hud {
      position: fixed; inset: 0; pointer-events: none;
      display: flex; flex-direction: column;
    }
    #hud .top {
      display: flex; justify-content: space-between; align-items: center;
      padding: env(safe-area-inset-top, 0) .9rem 0;
      padding-top: max(env(safe-area-inset-top, 0), .8rem);
    }
    #level { font-weight: 700; }
    #phase { opacity: .8; letter-spacing: .08em; font-size: .8rem; }
    #lives { letter-spacing: .12em; font-size: 1.1rem; }
    #lives .on { color: #ff6b5b; }
    #lives .off { color: #4a2c33; }

    /* Effetti attivi: chip con countdown, in alto a sinistra sotto il livello. */
    #effects {
      padding: .35rem .9rem 0;
      display: flex; gap: .4rem; flex-wrap: wrap;
      font-size: .78rem;
    }
    .fx {
      display: inline-flex; align-items: center; gap: .3rem;
      padding: .12rem .5rem; border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .fx.freeze { color: #6fc7e0; border-color: rgba(111, 199, 224, 0.5); }
    .fx.reveal { color: #e8c04a; border-color: rgba(232, 192, 74, 0.5); }
    #banner {
      margin-top: auto; margin-bottom: 30vh; text-align: center;
      font-weight: 700; letter-spacing: .04em; font-size: 1.1rem;
      text-shadow: 0 2px 8px #000;
    }
    /* Scritta di fine livello: grande e dorata. */
    #banner.win {
      font-size: 2.1rem; letter-spacing: .06em;
      color: #ffe08a;
      text-shadow: 0 0 18px rgba(255, 210, 90, 0.7), 0 3px 10px #000;
      animation: winpop .3s ease-out;
    }
    @keyframes winpop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    /* D-Pad touch: croce in basso al centro. Riceve gli eventi (gli altri
       elementi dell'HUD restano pointer-events:none). */
    #dpad {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: max(env(safe-area-inset-bottom, 0), 4vh);
      display: grid; grid-template-columns: repeat(3, 1fr);
      grid-template-areas: ".  up  ." "lt .  rt" ".  dn .";
      gap: 8px; pointer-events: auto; touch-action: none;
    }
    .db {
      width: 62px; height: 62px; font-size: 1.4rem;
      color: #dfe7ff; background: rgba(40, 52, 82, 0.55);
      border: 1px solid rgba(140, 170, 230, 0.35); border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      touch-action: none; -webkit-user-select: none; user-select: none;
      backdrop-filter: blur(2px);
    }
    .db.active { background: rgba(90, 120, 190, 0.85); }
    .db.up { grid-area: up; } .db.down { grid-area: dn; }
    .db.left { grid-area: lt; } .db.right { grid-area: rt; }

    /* Restart, mute e scossa: angoli in basso, lontani dal D-Pad. */
    #restart, #mute, #quake {
      position: fixed;
      bottom: max(env(safe-area-inset-bottom, 0), 4vh);
      width: 46px; height: 46px; font-size: 1.2rem;
      color: #dfe7ff; background: rgba(40, 52, 82, 0.55);
      border: 1px solid rgba(140, 170, 230, 0.35); border-radius: 12px;
      pointer-events: auto; touch-action: none;
    }
    #restart { right: .8rem; }
    #mute { left: .8rem; }
    #quake { left: calc(.8rem + 56px); }
    #quake.off { opacity: .4; }

    /* Lampo bianco (comparsa del guardiano). */
    #flash {
      position: fixed; inset: 0; background: #fff; opacity: 0;
      pointer-events: none; z-index: 20;
    }

    /* Schermate di titolo e game over. */
    .screen {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1rem; text-align: center; padding: 2rem;
      background: rgba(10, 10, 18, 0.85);
    }
    .screen.hidden { display: none; }
    .screen h1 { margin: 0; font-size: 2rem; letter-spacing: .12em; line-height: 1.15; }
    .screen .hint { margin: 0; opacity: .75; font-size: .9rem; line-height: 1.5; }
    .screen .best { margin: 0; opacity: .7; font-size: .85rem; }
    .screen .play {
      margin-top: .4rem; padding: .7rem 1.6rem; font-size: 1.05rem; font-weight: 700;
      color: #0a0a12; background: #6fc7e0; border: none; border-radius: 12px;
      pointer-events: auto; touch-action: manipulation; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <div id="hud">
    <div class="top">
      <span id="level"></span>
      <span id="phase"></span>
      <span id="lives"></span>
    </div>
    <div id="effects"></div>
    <div id="banner"></div>
  </div>

  <!-- D-Pad touch (Fase 3). Su desktop resta usabile col mouse. -->
  <div id="dpad">
    <button class="db up" data-dir="up" aria-label="su">▲</button>
    <button class="db left" data-dir="left" aria-label="sinistra">◀</button>
    <button class="db right" data-dir="right" aria-label="destra">▶</button>
    <button class="db down" data-dir="down" aria-label="giù">▼</button>
  </div>
  <button id="restart" aria-label="ricomincia">↺</button>
  <button id="mute" aria-label="audio">🔊</button>
  <button id="quake" aria-label="scossa e vibrazione">📳</button>

  <!-- Lampo bianco alla comparsa del guardiano. -->
  <div id="flash"></div>

  <!-- Schermata iniziale (Fase 6). -->
  <div id="title" class="screen">
    <h1>FUGA<br>ISOMETRICA</h1>
    <p class="hint">Memorizza il percorso durante l'anteprima,<br>poi ripercorrilo a memoria prima che il villain ti raggiunga.</p>
    <button class="play" id="playBtn">▶ Gioca</button>
    <p class="best" id="titleBest"></p>
  </div>

  <!-- Schermata di game over (Fase 6). -->
  <div id="gameover" class="screen hidden">
    <h1>GAME OVER</h1>
    <p class="hint" id="goResult"></p>
    <p class="best" id="goBest"></p>
    <button class="play" id="retryBtn">↺ Riprova</button>
  </div>

  <!-- Punto di ingresso: collega core + render + input. Percorso relativo, così
       il gioco funziona in qualsiasi cartella (radice o sottocartella). L'anti-
       cache è gestito dagli header dell'.htaccess (opzionale). -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
